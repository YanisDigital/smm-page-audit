<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f7f5f2; --surface: #ffffff; --surface-2: #f1eee9; --text: #1d1b19; --muted: #6b655e;
  --line: #e4dfd8; --accent: #c13584; --accent-soft: #fbe8f2; --accent-2: #f58529;
  --good: #1f8a5b; --good-soft: #e5f4ec; --warn: #b4540a; --warn-soft: #fdf0e3;
  --info: #2f5fb3; --info-soft: #e8eefa; --low: #d9534f; --mid: #e0a030; --high: #1f8a5b;
  --chart: #c13584; --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141312; --surface: #1d1c1a; --surface-2: #262422; --text: #eeeae5; --muted: #a39d95;
    --line: #34312d; --accent: #f06bb5; --accent-soft: #3a1f2e; --accent-2: #f79a4c;
    --good: #4cc38a; --good-soft: #17301f; --warn: #f0a050; --warn-soft: #36261a;
    --info: #7aa2f0; --info-soft: #1c2638; --shadow: none; --chart: #e0559f;
  }
}
:root[data-theme="dark"] {
  --bg: #141312; --surface: #1d1c1a; --surface-2: #262422; --text: #eeeae5; --muted: #a39d95;
  --line: #34312d; --accent: #f06bb5; --accent-soft: #3a1f2e; --accent-2: #f79a4c;
  --good: #4cc38a; --good-soft: #17301f; --warn: #f0a050; --warn-soft: #36261a;
  --info: #7aa2f0; --info-soft: #1c2638; --shadow: none; --chart: #e0559f;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
.hero { background: linear-gradient(120deg, var(--accent-soft), var(--surface) 70%); border-bottom: 1px solid var(--line); }
.hero-inner { max-width: 1180px; margin: 0 auto; padding: 48px 24px 36px; }
.eyebrow { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; letter-spacing: -.01em; }
.subtitle { margin: 10px 0 20px; color: var(--muted); font-size: 18px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; color: var(--muted); align-items: baseline; }
.hero-meta b { color: var(--text); font-size: 18px; }
.hero-meta a { overflow-wrap: anywhere; }
.layout { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; }
nav.toc { position: sticky; top: 20px; align-self: start; font-size: 14px; }
nav.toc .toc-title { font-weight: 600; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; }
nav.toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
nav.toc a:hover { background: var(--surface-2); }
main { min-width: 0; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow); scroll-margin-top: 16px; }
h2 { margin: 0 0 16px; font-size: 24px; display: flex; align-items: center; gap: 12px; }
.sec-n { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 15px; flex: none; }
h3 { font-size: 17px; margin: 22px 0 10px; }
h4 { margin: 6px 0 6px; font-size: 16px; }
.lead { font-size: 17px; color: var(--muted); }
.verdict { display: flex; gap: 22px; align-items: center; background: var(--surface-2); border-radius: var(--radius); padding: 18px 20px; }
.verdict p { margin: 0; }
.overall { text-align: center; flex: none; }
.overall-value { font-size: 44px; font-weight: 700; color: var(--accent); line-height: 1; }
.overall-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 24px; margin: 22px 0; }
.score-top { display: flex; justify-content: space-between; font-size: 15px; }
.score-reason { font-size: 13px; color: var(--muted); margin-top: 4px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; min-width: 60px; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; }
.bar span.lvl-low { background: var(--low); } .bar span.lvl-mid { background: var(--mid); } .bar span.lvl-high { background: var(--high); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.panel { border-radius: var(--radius); padding: 4px 20px 12px; }
.panel.warn { background: var(--warn-soft); } .panel.good { background: var(--good-soft); }
.panel ol { padding-left: 20px; margin: 0; } .panel li { margin-bottom: 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 8px 0 18px; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 14px; }
.tile-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile-label { font-size: 13px; color: var(--muted); }
.table-wrap { overflow-x: auto; margin: 12px 0 18px; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 12px 0 18px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.card-n { font-size: 12px; color: var(--muted); font-weight: 600; }
.tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 99px; }
.card-body { font-size: 14px; }
.card-meta { font-size: 13px; color: var(--muted); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.callout { border-radius: 12px; padding: 14px 16px; margin: 14px 0; border-left: 4px solid; }
.callout.info { background: var(--info-soft); border-color: var(--info); }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.callout.good { background: var(--good-soft); border-color: var(--good); }
.copy { position: relative; background: var(--surface-2); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
.copy-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; padding-right: 100px; }
.copy pre { margin: 0; white-space: pre-wrap; font: inherit; font-size: 15px; }
.copy-btn { position: absolute; top: 10px; right: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.checklist { list-style: none; padding: 0; }
.checklist li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.checklist input { accent-color: var(--accent); margin-right: 6px; }
.notes { font-size: 14px; color: var(--muted); }
.notes h3:first-child { margin-top: 0; }
.sources a { overflow-wrap: anywhere; }
.legend { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.kt { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 1px 7px; border-radius: 99px; margin-right: 4px; vertical-align: 1px; border: 1px solid; }
.kt.fact { color: var(--good); border-color: var(--good); }
.kt.hyp { color: var(--warn); border-color: var(--warn); }
.kt.est { color: var(--info); border-color: var(--info); }
.chart { margin: 14px 0 20px; }
.chart figcaption { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart text.val { fill: var(--text); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .grid.soft { stroke-dasharray: 3 4; }
.chart .bar { fill: var(--chart); }
.chart .hit { fill: transparent; }
.chart .mark:hover .bar { opacity: .75; }
footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; font-size: 13px; color: var(--muted); }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 16px 16px 40px; gap: 16px; }
  nav.toc { position: static; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .hero-inner { padding: 32px 16px 24px; }
  section { padding: 20px 16px; }
  .two-col { grid-template-columns: 1fr; }
  .verdict { flex-direction: column; align-items: flex-start; }
  footer { padding: 0 16px 32px; }
}
@media print {
  body { background: #fff; color: #000; }
  nav.toc, .copy-btn { display: none; }
  .layout { display: block; padding: 0; }
  section { box-shadow: none; break-inside: avoid-page; }
}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">{{HERO}}</div></header>
<div class="layout">
  <nav class="toc"><div class="toc-title">{{CONTENTS_LABEL}}</div>{{NAV}}</nav>
  <main>{{CONTENT}}</main>
</div>
<footer>{{FOOTER}}</footer>
<script>
document.querySelectorAll('.copy-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var text = btn.parentElement.querySelector('pre').innerText;
    var done = function () { var old = btn.textContent; btn.textContent = btn.dataset.done; setTimeout(function () { btn.textContent = old; }, 1500); };
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, function () {}); }
  });
});
</script>
</body>
</html>
